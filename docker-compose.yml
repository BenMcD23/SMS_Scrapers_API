# Local development database only. The API runs on the k3s cluster
# (deploy/), or locally with uvicorn - see the README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 317_SMS
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
