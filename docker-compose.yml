services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 317_SMS
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d 317_SMS"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    # Migrations deliberately do NOT run here — a failed one used to kill the
    # whole container via `&&`. The deploy script runs them as a separate step.
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    shm_size: 768mb
    deploy:
      resources:
        limits:
          memory: 6gb
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://sms_user:${POSTGRES_PASSWORD}@db:5432/317_SMS
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
