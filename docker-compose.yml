# The home stack, after the move to the cloud: the scraper worker and nothing
# else. Postgres lives on Neon and the API on Lambda, so neither is here, and
# no service in this file listens for anything — the worker claims its work
# over an outbound connection to Neon.
#
# Tailscale is kept purely as an admin convenience (SSH and deploys). It no
# longer fronts anything user-facing, so if it drops, scrapers pause and the
# site carries on.
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    command: python -m worker
    restart: unless-stopped
    # No healthcheck: there is no port to probe. `docker compose logs -f worker`
    # shows the claim loop, and a wedged run is caught by the idle watchdog.
    shm_size: 768mb
    deploy:
      resources:
        limits:
          memory: 6gb
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/app:/app
      # DATABASE_URL comes from .env and points at Neon — the *direct*
      # (non-pooled) host. The worker holds a handful of long-lived
      # connections, which is what the direct endpoint is for; PgBouncer is
      # there for the Lambda's short-lived ones.

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-prod
    hostname: 317-sms-api
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=317-sms-api
      # TS_SERVE_CONFIG is gone with serve-config.json: Funnel used to be the
      # public front door for the whole API, which is exactly the single point
      # of failure this rewrite removes.
    volumes:
      - ./tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
