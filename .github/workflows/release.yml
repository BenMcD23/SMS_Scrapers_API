# Builds the API image and records the new tag in the Kustomize overlay that
# Argo CD watches. Argo CD does the actual deploy.
#
#   main:        only when VERSION changes → ghcr.io/benmcd23/sms-api:<VERSION>
#                and the prod overlay's newTag → committed back to main.
#   development: every push → :dev-<sha> and the dev overlay's newTag →
#                committed back to development.
#
# The commit is made with GITHUB_TOKEN, which deliberately does not trigger
# workflows, so it can't loop.
name: Release

on:
  push:
    branches: [main, development]
    # `paths` applies to every listed branch, so development is filtered in
    # the job instead (see `if` below) rather than here.
  workflow_dispatch:
  # sync-main-to-dev pushes development with GITHUB_TOKEN, which fires no
  # workflows, so it calls this one directly with the branch to build.
  workflow_call:
    inputs:
      ref:
        description: Branch to build (main or development)
        type: string
        required: true

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/benmcd23/sms-api
  BRANCH: ${{ inputs.ref || github.ref_name }}

jobs:
  release:
    # main releases only on a VERSION bump; development builds every push.
    if: >-
      github.event_name != 'push'
      || github.ref_name == 'development'
      || contains(join(github.event.commits.*.modified, ' '), 'VERSION')
      || contains(join(github.event.commits.*.added, ' '), 'VERSION')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Work out the tag and overlay
        id: meta
        run: |
          if [[ "$BRANCH" == "main" ]]; then
            tag="$(tr -d '[:space:]' < VERSION)"
            overlay=deploy/overlays/prod
          else
            tag="dev-${GITHUB_SHA::7}"
            overlay=deploy/overlays/dev
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "overlay=$overlay" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published version
        if: env.BRANCH == 'main'
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.meta.outputs.tag }}" | grep -q .; then
            echo "::error::v${{ steps.meta.outputs.tag }} already exists — bump VERSION"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ env.BRANCH == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      - name: Point the overlay at the new image
        run: |
          cd "${{ steps.meta.outputs.overlay }}"
          kustomize edit set image "${IMAGE}=${IMAGE}:${{ steps.meta.outputs.tag }}"
          git diff --stat

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.meta.outputs.overlay }}/kustomization.yaml"
          git commit -m "deploy: ${BRANCH} → ${IMAGE}:${{ steps.meta.outputs.tag }}"
          if [[ "$BRANCH" == "main" ]]; then
            git tag "v${{ steps.meta.outputs.tag }}"
            git push origin main "v${{ steps.meta.outputs.tag }}"
          else
            git push origin development
          fi
