name: Deploy API

# Builds the image and points the environment's overlay at it. Argo CD does
# the actual deploy when it sees the commit - nothing here talks to the cluster.
#   main        -> deploy/overlays/prod
#   development -> deploy/overlays/dev

on:
  push:
    branches:
      - main
      - development
  # Redeploy the branch you pick, without needing an empty commit.
  workflow_dispatch:
  # Called by sync-main-to-dev, whose own event is a push to *main* — so the
  # branch to deploy has to be passed in rather than read off github.ref_name,
  # or syncing dev would deploy prod.
  workflow_call:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        required: true

# Two deploys of one branch would race on the tag-bump push.
concurrency:
  group: deploy-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set environment
        run: |
          BRANCH="${{ inputs.ref || github.ref_name }}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          if [[ "$BRANCH" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      # github.sha is main's commit when called from sync-main-to-dev, so tag
      # by what was actually checked out.
      - name: Image tag
        run: echo "TAG=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/benmcd23/sms_scrapers_api:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushed with GITHUB_TOKEN, which doesn't trigger workflows, so this
      # can't loop. Retries rebase over anything pushed meanwhile.
      - name: Point the overlay at the new image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s/^\(\s*newTag:\).*/\1 $TAG/" deploy/overlays/$ENV/kustomization.yaml
          git commit -am "Deploy $ENV $TAG [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:$BRANCH && exit 0
            git pull --rebase origin $BRANCH
          done
          exit 1
