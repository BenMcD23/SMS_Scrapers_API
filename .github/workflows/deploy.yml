name: Deploy API

on:
  push:
    branches:
      - main
      - development
  # Redeploy the branch you pick, without needing an empty commit.
  workflow_dispatch:
  # Called by sync-main-to-dev, whose own event is a push to *main* — so the
  # branch to deploy has to be passed in rather than read off github.ref_name,
  # or syncing dev would deploy prod.
  workflow_call:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        required: true

# There are two deploy targets sharing one schema now (the Lambda and the home
# worker), so two overlapping runs could put new code against an old schema.
concurrency:
  group: deploy-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC, so no long-lived AWS keys live in this repo

jobs:
  # ── 1. Schema first, once ───────────────────────────────────────────────────
  # Against Neon's *direct* URL: PgBouncer can't run the session-level things
  # migrations do. Both deploys below wait on this, so neither ever runs new
  # code against an old schema.
  migrate:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.setenv.outputs.env }}
    steps:
      - name: Set environment
        id: setenv
        run: |
          BRANCH="${{ inputs.ref || github.ref_name }}"
          if [[ "$BRANCH" == "main" ]]; then ENV=prod; else ENV=dev; fi
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "ENV=$ENV"       >> $GITHUB_ENV
          echo "env=$ENV"       >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run migrations against Neon
        env:
          # The direct (non-pooled) endpoint — NOT the -pooler host.
          DATABASE_URL: ${{ secrets[format('NEON_DIRECT_URL_{0}', steps.setenv.outputs.env == 'prod' && 'PROD' || 'DEV')] }}
        run: |
          alembic -c database/alembic.ini current
          alembic -c database/alembic.ini upgrade head
          alembic -c database/alembic.ini current

  # ── 2. The cloud API ────────────────────────────────────────────────────────
  api:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      ENV: ${{ needs.migrate.outputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$ENV-${GITHUB_SHA::12}"
          # Dockerfile.api, not Dockerfile.worker: no Chromium, no Playwright,
          # none of the X11 libraries — that's most of the cold start.
          docker build -f Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update the Lambda
        run: |
          FN="${{ vars.LAMBDA_FUNCTION_NAME_PREFIX }}-$ENV"
          aws lambda update-function-code --function-name "$FN" --image-uri "$IMAGE" >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          aws lambda publish-version --function-name "$FN" >/dev/null

      - name: Smoke-test the Function URL
        run: |
          FN="${{ vars.LAMBDA_FUNCTION_NAME_PREFIX }}-$ENV"
          URL=$(aws lambda get-function-url-config --function-name "$FN" --query FunctionUrl --output text)
          # /ping is unauthenticated and touches nothing — enough to prove the
          # new image starts and answers before anyone notices it doesn't.
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "${URL}ping" | grep -q '"ok":true'; then
              echo "API healthy at $URL"
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep $((attempt * 4))
          done
          echo "API did not come up" >&2
          exit 1

  # ── 3. The home worker ──────────────────────────────────────────────────────
  # Still over Tailscale SSH — the one thing Tailscale is still for. If this
  # step fails the site is unaffected; only scrapers are.
  worker:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      ENV: ${{ needs.migrate.outputs.env }}
      BRANCH: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy the worker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV,BRANCH
          script: |
            set -e
            cd ~/sms-api/$ENV
            # Force-pushes make `git pull` diverge; the server is a deploy target,
            # not a workspace, so just match the remote exactly.
            git fetch origin $BRANCH
            git reset --hard FETCH_HEAD
            if [[ "$ENV" == "prod" ]]; then
              DC="docker compose -p sms-prod -f docker-compose.yml -f docker-compose.prod.yml"
            else
              DC="docker compose -p sms-dev -f docker-compose.yml -f docker-compose.dev.yml"
            fi
            # No db to bring up and no migration step here — the schema was
            # migrated in CI before this job started. Leaving tailscale
            # untouched avoids the fixed-container_name conflict on recreate.
            $DC build worker
            # The worker hands any in-flight job back to the queue on SIGTERM,
            # so a deploy mid-scrape requeues rather than wedging it.
            $DC up -d worker
            docker image prune -f
