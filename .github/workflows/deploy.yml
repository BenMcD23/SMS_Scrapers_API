name: Deploy API

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set environment
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV
          script: |
            set -e
            cd ~/sms-api/$ENV
            # Force-pushes make `git pull` diverge; the server is a deploy target,
            # not a workspace, so just match the remote exactly.
            git fetch origin ${{ github.ref_name }}
            git reset --hard FETCH_HEAD
            # Only rebuild/recreate db+api. Leaving tailscale untouched keeps the
            # ingress up during deploys and avoids the fixed-container_name conflict
            # that the old `docker rm -f tailscale` workaround existed to paper over.
            # ponytail: if tailscale itself ever needs updating, run a full `up -d` by hand.
            if [[ "$ENV" == "prod" ]]; then
              DC="docker compose -p sms-prod -f docker-compose.yml -f docker-compose.prod.yml"
            else
              DC="docker compose -p sms-dev -f docker-compose.yml -f docker-compose.dev.yml"
            fi
            # db first, then migrate, then swap the api. `set -e` means a failed
            # migration aborts the deploy with the old api still serving.
            $DC build api
            $DC up -d --wait db
            $DC run --rm api alembic -c database/alembic.ini upgrade head
            $DC up -d --wait api
            docker image prune -f
