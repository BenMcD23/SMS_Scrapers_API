name: Sync main to development

on:
  push:
    branches:
      - main

# Two pushes to main in quick succession would otherwise race and the second
# push to development gets rejected as non-fast-forward.
concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into development
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin development
          git checkout development
          before=$(git rev-parse HEAD)
          git merge origin/main --no-edit
          if [ "$before" = "$(git rev-parse HEAD)" ]; then
            echo "development already had main — nothing to deploy"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            git push origin development
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

  # This push was made with GITHUB_TOKEN, which deliberately doesn't trigger
  # further workflows, so deploy has to be called rather than waited for.
  deploy:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: development
    secrets: inherit
