name: Sync main to development

on:
  push:
    branches:
      - main

# Two pushes to main in quick succession would otherwise race and the second
# push to development gets rejected as non-fast-forward.
concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin development
          git checkout development
          git merge origin/main --no-edit
          git push origin development
