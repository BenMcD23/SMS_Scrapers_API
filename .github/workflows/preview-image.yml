name: Preview image

# Builds every branch into ghcr.io/benmcd23/sms_scrapers_api:preview-<branch>,
# for the cluster's preview stacks (k3s-homelab, ADR 0010). A stack runs the
# seeded dev server (app/scripts/dev_server.py) from it, never a real database.
# The tag moves with the branch; the stack pins the digest it resolved, so a
# new push rolls the preview. main becomes preview-main, the fallback for a
# stack whose branch doesn't exist in this repo.
#
# Nothing here talks to the cluster: label a pull request `preview` (in this
# repo, the SMS site or the portal) and the cluster picks the image up.

on:
  push:
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:

# Only the newest push of a branch is worth finishing.
concurrency:
  group: preview-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Must match slug() in k3s-homelab's previews/resolver/resolver.py, which
      # looks the tag up by branch name.
      - name: Tag
        run: |
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
          echo "TAG=preview-$slug" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: previews run on home. Reads deploy.yml's layer cache but
      # writes its own scope, so branch builds don't evict prod's.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/benmcd23/sms_scrapers_api:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha
            type=gha,scope=preview
          cache-to: type=gha,mode=max,scope=preview
