[pytest]
# Tests import both from app/ (core, routers, scripts, api) and from the repo
# root (database/), so both go on sys.path. This is what replaced the five
# different PYTHONPATH incantations the test files each used to document.
pythonpath = . app
testpaths = app

# Show the reason for every non-passing outcome rather than a bare letter.
addopts = -ra
