# Argo CD watches deploy/overlays/prod on main. release.yml bumps the image
# tag there whenever VERSION changes, and Argo CD applies it within its poll
# interval (3 minutes by default) — no kubectl from CI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sms-api-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BenMcD23/SMS_Scrapers_API.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  # Secrets are created by hand and never in git; CNPG rewrites some of its
  # own status fields, which Argo CD should not fight.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
