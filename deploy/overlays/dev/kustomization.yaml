apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-dev

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: config.patch.yaml
  - path: scale.patch.yaml

# Updated by .github/workflows/release.yml on every push to development.
images:
  - name: ghcr.io/benmcd23/sms-api
    newTag: dev
