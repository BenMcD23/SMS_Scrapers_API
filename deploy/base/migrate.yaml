# Alembic migrations, run by Argo CD on every sync before the Deployment is
# touched (wave 1, the Deployment is wave 2). If this fails the sync stops and
# the old API keeps serving.
apiVersion: batch/v1
kind: Job
metadata:
  name: sms-api-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  # On the very first sync the database is still initialising; retries cover it.
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values: [interactive, batch]
              # Fallback if home goes down: oracle2 holds the other database
              # instance. (Terms are ORed.)
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [oracle2]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: ghcr.io/benmcd23/sms_scrapers_api
          # The migration history has no initial create-tables migration (see
          # README "Wiping the dev database"), so a brand-new database is built
          # from the models and stamped instead. Exit 3 means "no
          # alembic_version table"; any other failure (DB not up yet) exits
          # non-zero and the Job retries, rather than being mistaken for empty.
          #
          # It first waits up to a minute for the database to accept a
          # connection. A new pod's IP isn't in the database node's
          # network-policy ipset for a second or more after it starts, so the
          # first connect is refused; without the wait every sync left a trail
          # of Error pods while the Job retried.
          command:
            - sh
            - -ec
            - |
              i=0
              until python -c 'from database.database import engine; engine.connect().close()' 2>/dev/null; do
                i=$((i + 1)); [ "$i" -lt 30 ] || { echo "database still unreachable after 60s"; exit 1; }
                echo "database not reachable yet; retrying in 2s ($i/30)"; sleep 2
              done
              rc=0
              python -c 'import sys; from sqlalchemy import inspect; from database.database import engine; sys.exit(0 if inspect(engine).has_table("alembic_version") else 3)' || rc=$?
              case $rc in
                0) alembic -c app/database/alembic.ini upgrade head ;;
                3) echo "empty database: creating tables from models, then stamping head"
                   python -c 'from database.models import Base; from database.database import engine; Base.metadata.create_all(engine)'
                   alembic -c app/database/alembic.ini stamp head ;;
                *) exit $rc ;;
              esac
          envFrom:
            - configMapRef:
                name: sms-api-config
            - secretRef:
                name: sms-api-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sms-db-app
                  key: uri
