# Public endpoint on oracle's own IP through Traefik, for the Vercel
# frontends. Replaced Tailscale Funnel, which crawled on large responses
# (7s vs 0.3s for 160KB): its proxy ran WireGuard inside a 1230-MTU pod.
# Traefik runs on both oracle nodes behind the OCI Network Load Balancer (k8s
# repo, clusters/prod/traefik.yaml); the certificate comes from cert-manager,
# below. DNS at domaindiscount24: A smsapi -> the load balancer's IP,
# CNAME smsapi-dev -> smsapi. overlays/dev renames the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sms-api-public
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  # No hosts list: Traefik picks the certificate by SNI, so dev's host rename
  # needs no patch here.
  tls:
    - secretName: sms-api-tls
  rules:
    - host: smsapi.317atc.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sms-api
                port:
                  number: 80
---
# Issued by cert-manager (ClusterIssuer in the k8s repo,
# clusters/prod/cert-manager.yaml) into a Secret, so any Traefik replica can
# serve it. overlays/dev renames the host here too.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sms-api-tls
spec:
  secretName: sms-api-tls
  dnsNames: [smsapi.317atc.co.uk]
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
