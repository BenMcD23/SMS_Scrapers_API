apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-api
spec:
  # One replica on purpose. The API keeps live scraper state and SSE log
  # streams in memory and runs the background scheduler in-process, so a
  # second replica would either miss those or double-fire jobs. Failover comes
  # from Kubernetes rescheduling this pod onto a surviving node, not from
  # running several at once. Scaling out needs that state moved to the
  # database first — see README "Why one replica".
  replicas: 1
  strategy:
    # Never two schedulers at once, even briefly during a rollout.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sms-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sms-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      # Move off a dead node quickly: the defaults wait five minutes before
      # evicting a pod from a NotReady node, which is the whole failover time.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: ghcr.io/benmcd23/sms-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sms-api-config
            - secretRef:
                name: sms-api-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sms-db-app
                  key: uri
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # Headless Chromium for the scrapers is the big consumer.
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Chromium's shared memory. Same job as compose's shm_size.
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 768Mi
        - name: tmp
          emptyDir: {}
