# Runs `alembic upgrade head` before Argo CD syncs the rest of the manifests.
# A failed migration fails the sync and leaves the old API serving — the same
# ordering the legacy compose deploy relied on.
apiVersion: batch/v1
kind: Job
metadata:
  name: sms-api-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sms-api-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: ghcr.io/benmcd23/sms-api
          command: ["alembic", "-c", "app/database/alembic.ini", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: sms-api-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sms-db-app
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
