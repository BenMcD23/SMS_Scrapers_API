# Non-secret configuration. Secrets (API keys, service-account key, Fernet key)
# live in the `sms-api-env` Secret, created by hand from .env — see README.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sms-api-config
data:
  LOG_LEVEL: "INFO"
  # Exactly one replica runs the scheduler; the Deployment is fixed at one.
  SCHEDULER_ENABLED: "true"
  SITE_BASE_URL: "https://sms.317atc.co.uk"
  CORS_ORIGINS: "https://sms.317atc.co.uk,https://317-sms-site.vercel.app"
  DB_BACKUP_ENABLED: "false"
  DEV_FAKE_AUTH: "0"
  CORS_ALLOW_LOCALHOST: "false"
