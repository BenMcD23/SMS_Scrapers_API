# Dev overrides for the home worker stack.
#
# The dev worker points at a Neon *branch* (set DATABASE_URL in this stack's
# .env), which gives a dev database carrying prod's data without maintaining a
# seeded one — so there is no dev `db` service here any more.
services:
  worker:
    environment:
      - WORKER_ENV=dev

  tailscale:
    container_name: tailscale-dev
    hostname: 317-sms-api-dev
    # TS_HOSTNAME is what actually registers with the tailnet — without this it
    # inherited the prod name and got auto-suffixed to 317-sms-api-1.
    environment:
      - TS_HOSTNAME=317-sms-api-dev
