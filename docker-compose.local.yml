# Local dev only: a Postgres to develop against without touching Neon.
#
# Production Postgres lives on Neon now, so the `db` service is defined here
# rather than in docker-compose.yml — bring it up with
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d db
# and point DATABASE_URL at localhost:5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 317_SMS
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d 317_SMS"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
